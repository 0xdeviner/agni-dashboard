version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: agni-web:latest
    container_name: agni-app
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 4000
      # Or put your cloud Mongo URI here instead of .env
      # MONGODB_URI: "mongodb+srv://USERNAME:PASSWORD@cluster0.xxxxx.mongodb.net/recon_tool?retryWrites=true&w=majority"
    ports:
      - "8080:4000"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "require('http').get('http://localhost:4000/health', r => process.exit(r.statusCode===200?0:1)).on('error', ()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 5